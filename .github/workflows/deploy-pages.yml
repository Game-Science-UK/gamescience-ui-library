name: Deploy GitHub Pages registry

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Theme contract
        run: npm run theme:check

      - name: Architecture contracts
        run: npm run architecture:check

      - name: Unit tests
        run: npm test

      - name: Library build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook

      - name: Registry build
        run: npm run registry:build

      - name: Registry validate
        run: npm run registry:validate

      - name: Pages build
        run: npm run pages:build

      - name: Pages validate
        run: npm run pages:validate

      - name: Registry smoke
        run: npm run smoke:registry

      - name: Pages smoke
        run: npm run smoke:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
